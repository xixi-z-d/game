name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Public HTTPS application URL
        required: false
        default: https://drawtogetherxixi-ggm028ng.b4a.run
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        env:
          APP_URL: ${{ inputs.app_url || 'https://drawtogetherxixi-ggm028ng.b4a.run' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug -PAPP_URL="$APP_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: draw-together-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
